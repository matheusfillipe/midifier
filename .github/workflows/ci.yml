name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev

      # pre-commit is the single source of truth for what "clean" means, so CI runs the
      # same hooks a commit does rather than a parallel list that can drift.
      - name: pre-commit
        run: uv run --extra dev pre-commit run --all-files --show-diff-on-failure

      - name: coverage summary
        if: always()
        run: uv run --extra dev pytest --cov --cov-report=xml -q

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7
